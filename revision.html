<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revision — RRB NTPC Tracker</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <header class="header" id="header"></header>

    <main class="main" id="main">

      <div class="page-header">
        <h1 class="page-title">🔁 Revision Center</h1>
        <p class="page-subtitle">Aaj ka revision plan — smart priority ke saath</p>
      </div>

      <!-- Stats Bar -->
      <div class="revision-stats-bar" id="statsBar">
        <div class="revision-stat-card" data-stat-filter="all">
          <div class="revision-stat-value">0</div>
          <div class="revision-stat-label">Total</div>
        </div>
        <div class="revision-stat-card due-today" data-stat-filter="today">
          <div class="revision-stat-value">0</div>
          <div class="revision-stat-label">Due Today</div>
        </div>
        <div class="revision-stat-card overdue" data-stat-filter="overdue">
          <div class="revision-stat-value">0</div>
          <div class="revision-stat-label">Overdue</div>
        </div>
        <div class="revision-stat-card confident" data-stat-filter="confident">
          <div class="revision-stat-value">0</div>
          <div class="revision-stat-label">Confident</div>
        </div>
        <div class="revision-stat-card doubtful" data-stat-filter="doubtful">
          <div class="revision-stat-value">0</div>
          <div class="revision-stat-label">Doubtful</div>
        </div>
        <div class="revision-stat-card confused" data-stat-filter="confused">
          <div class="revision-stat-value">0</div>
          <div class="revision-stat-label">Confused</div>
        </div>
      </div>

            <!-- Streak + Subject Summary -->
      <div class="revision-overview-row mb-5">

        <!-- Revision Streak -->
        <div class="card revision-streak-card">
          <div class="revision-streak-icon">🔥</div>
          <div class="revision-streak-info">
            <div class="revision-streak-value" id="streakValue">0</div>
            <div class="revision-streak-label">Day Revision Streak</div>
          </div>
          <div class="revision-streak-sub" id="streakSub">
            Roz revise karo, streak banao!
          </div>
        </div>

        <!-- Subject Summary -->
        <div class="card revision-subject-card">
          <div class="card-header">
            <div class="card-title">📊 By Subject</div>
          </div>
          <div id="subjectSummaryList"></div>
        </div>

      </div>

            <!-- Bulk Actions Bar -->
      <div class="revision-bulk-bar hidden" id="bulkBar">
        <div class="revision-bulk-left">
          <input type="checkbox" id="bulkSelectAll" />
          <label for="bulkSelectAll">Select all <span id="bulkCount">(0)</span></label>
        </div>
        <div class="revision-bulk-right">
          <button class="btn btn-success btn-sm" id="bulkReviseBtn" disabled>
            ✅ Revise All Selected
          </button>
          <button class="btn btn-ghost btn-sm" id="bulkClearBtn">
            Clear
          </button>
        </div>
      </div>

      <!-- Filters + Sort + Search -->
      <div class="revision-toolbar">
        <div class="revision-filters" id="revisionFilters">
          <button class="filter-pill active" data-filter="all">All</button>
          <button class="filter-pill" data-filter="overdue">🔴 Overdue</button>
          <button class="filter-pill" data-filter="today">🟡 Today</button>
          <button class="filter-pill" data-filter="upcoming">🟢 Upcoming</button>
          <button class="filter-pill" data-filter="mastered">⭐ Mastered</button>
          <button class="filter-pill" data-filter="confused">❌ Confused</button>
          <button class="filter-pill" data-filter="not-revised">⚪ Not Revised</button>
        </div>

        <div class="revision-toolbar-right">
          <select class="form-select form-input-sm" id="revisionSortSelect">
            <option value="priority">Sort: By Priority</option>
            <option value="lastDate">Sort: Last Revised</option>
            <option value="count">Sort: Revision Count</option>
            <option value="name">Sort: Name</option>
          </select>
          <input type="text" class="form-input form-input-sm" id="revisionSearch" placeholder="🔍 Search..." />
        </div>
      </div>

      <!-- Cards Container -->
      <div id="revisionCardsContainer"></div>

    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/revision.js"></script>

</body>
</html>
