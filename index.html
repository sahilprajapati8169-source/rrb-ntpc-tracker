<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — RRB NTPC Tracker</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/loading.css" />
</head>
<body>
    <!-- Loading Screen -->
  <!-- Loading Screen — Compact Train -->
<div class="loader-screen" id="loaderScreen">
  <div class="loader-card">

    <!-- Header -->
    <div class="loader-header">
      <div class="loader-logo-icon">🎯</div>
      <div class="loader-title">RRB NTPC Tracker</div>
      <div class="loader-subtitle">Apna selection pakka karo</div>
    </div>

    <!-- Scene: Sky + Track + Train -->
    <div class="loader-scene">
      <div class="scene-sun"></div>
      <div class="scene-cloud scene-cloud-1"></div>
      <div class="scene-cloud scene-cloud-2"></div>
      <div class="scene-cloud scene-cloud-3"></div>
      <div class="scene-hill scene-hill-1"></div>
      <div class="scene-hill scene-hill-2"></div>
      <div class="scene-track"></div>
      <div class="scene-sleepers">
        <div class="scene-sleeper-strip">
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
        </div>
      </div>
      <div class="scene-ground"></div>
      <div class="speed-line speed-line-1"></div>
      <div class="speed-line speed-line-2"></div>
      <div class="scene-train">
        <div class="train-smoke">
          <div class="smoke-puff smoke-puff-1"></div>
          <div class="smoke-puff smoke-puff-2"></div>
          <div class="smoke-puff smoke-puff-3"></div>
          <div class="smoke-puff smoke-puff-4"></div>
        </div>
        <div class="train-nose"></div>
        <div class="train-headlight"></div>
        <div class="train-body">
          <div class="train-stripe-blue"></div>
          <div class="train-stripe-red"></div>
          <div class="train-windows">
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
          </div>
        </div>
        <div class="train-wheels">
          <div class="train-wheel"></div>
          <div class="train-wheel"></div>
          <div class="train-wheel"></div>
          <div class="train-wheel"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="loader-footer">
      <div class="loader-bar-wrap">
        <div class="loader-bar" id="loaderBar"></div>
      </div>
      <div class="loader-percent" id="loaderPercent">Loading 0%</div>
      <div class="loader-quote" id="loaderQuote">
        <span style="margin-right: 6px;">💡</span> Loading...
      </div>
    </div>

  </div>
</div>

  <div class="login-page">
    <div class="login-box">

      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">🎯</div>
        <h1 class="login-title">RRB NTPC Tracker</h1>
        <p class="login-subtitle">Apna selection pakka karo</p>
      </div>

      <!-- Error message -->
      <div class="login-error" id="loginError"></div>

      <!-- Login Form -->
      <form id="loginForm">

        <div class="form-group">
          <label class="form-label" for="nameInput">Your Name</label>
          <input 
            type="text" 
            id="nameInput" 
            class="form-input" 
            placeholder="Enter your name" 
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="emailInput">Email</label>
          <input 
            type="email" 
            id="emailInput" 
            class="form-input" 
            placeholder="you@example.com" 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <input 
            type="password" 
            id="passwordInput" 
            class="form-input" 
            placeholder="Enter password" 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Login / Sign Up
        </button>

      </form>

      <!-- Divider -->
      <div class="login-divider">OR</div>

      <!-- Google Button -->
      <button class="btn-google" id="googleBtn">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Skip -->
      <div class="login-footer">
        <a id="skipBtn">Skip — Continue as Guest</a>
      </div>

    </div>
  </div>

    <script src="js/loading.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
