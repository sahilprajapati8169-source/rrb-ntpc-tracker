<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syllabus — RRB NTPC Tracker</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/loading.css" />
</head>
<body>
    <!-- Loading Screen -->
  <!-- Loading Screen — Compact Train -->
<div class="loader-screen" id="loaderScreen">
  <div class="loader-card">

    <!-- Header -->
    <div class="loader-header">
      <div class="loader-logo-icon">🎯</div>
      <div class="loader-title">RRB NTPC Tracker</div>
      <div class="loader-subtitle">Apna selection pakka karo</div>
    </div>

    <!-- Scene: Sky + Track + Train -->
    <div class="loader-scene">
      <div class="scene-sun"></div>
      <div class="scene-cloud scene-cloud-1"></div>
      <div class="scene-cloud scene-cloud-2"></div>
      <div class="scene-cloud scene-cloud-3"></div>
      <div class="scene-hill scene-hill-1"></div>
      <div class="scene-hill scene-hill-2"></div>
      <div class="scene-track"></div>
      <div class="scene-sleepers">
        <div class="scene-sleeper-strip">
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
          <div class="scene-sleeper"></div>
        </div>
      </div>
      <div class="scene-ground"></div>
      <div class="speed-line speed-line-1"></div>
      <div class="speed-line speed-line-2"></div>
      <div class="scene-train">
        <div class="train-smoke">
          <div class="smoke-puff smoke-puff-1"></div>
          <div class="smoke-puff smoke-puff-2"></div>
          <div class="smoke-puff smoke-puff-3"></div>
          <div class="smoke-puff smoke-puff-4"></div>
        </div>
        <div class="train-nose"></div>
        <div class="train-headlight"></div>
        <div class="train-body">
          <div class="train-stripe-blue"></div>
          <div class="train-stripe-red"></div>
          <div class="train-windows">
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
            <div class="train-window"></div>
          </div>
        </div>
        <div class="train-wheels">
          <div class="train-wheel"></div>
          <div class="train-wheel"></div>
          <div class="train-wheel"></div>
          <div class="train-wheel"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="loader-footer">
      <div class="loader-bar-wrap">
        <div class="loader-bar" id="loaderBar"></div>
      </div>
      <div class="loader-percent" id="loaderPercent">Loading 0%</div>
      <div class="loader-quote" id="loaderQuote">
        <span style="margin-right: 6px;">💡</span> Loading...
      </div>
    </div>

  </div>
</div>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <header class="header" id="header"></header>

    <main class="main" id="main">

      <div class="page-header">
        <h1 class="page-title">Syllabus</h1>
        <p class="page-subtitle">Subject → Topic → Subtopic — sab yahan</p>
      </div>

      <!-- Overall Stats -->
      <div class="dashboard-grid mb-5">

        <div class="stat-card">
          <div class="stat-icon">📚</div>
          <div class="stat-label">Total Topics</div>
          <div class="stat-value" id="totalTopics">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background-color: var(--success-light); color: var(--success);">✅</div>
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="completedTopics">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background-color: var(--warning-light); color: var(--warning);">🟡</div>
          <div class="stat-label">In Progress</div>
          <div class="stat-value" id="inProgressTopics">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background-color: var(--hover); color: var(--text-muted);">⏳</div>
          <div class="stat-label">Not Started</div>
          <div class="stat-value" id="notStartedTopics">0</div>
        </div>

      </div>

      <!-- Toolbar: Search + Filters -->
      <div class="syllabus-toolbar">
        <div class="syllabus-search">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search topic..." 
          />
        </div>

        <div class="filter-pills" id="filterPills">
          <button class="filter-pill active" data-filter="all">All</button>
          <button class="filter-pill" data-filter="completed">✅ Completed</button>
          <button class="filter-pill" data-filter="in_progress">🟡 In Progress</button>
          <button class="filter-pill" data-filter="not_started">⏳ Not Started</button>
          <button class="filter-pill" data-filter="weak">🔴 Weak</button>
        </div>
      </div>

      <!-- Subjects List -->
      <div id="subjectsContainer"></div>

    </main>
  </div>

    <script src="js/loading.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/syllabus.js"></script>

</body>
</html>
